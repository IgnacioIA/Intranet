spring.application.name=Laucom

# Fase 2 (Persistencia) — REQ-AUTH-026: sin secretos versionados, sin ddl-auto=create/update.
# Los valores por defecto son solo para desarrollo local; en cualquier otro entorno se
# sobreescriben mediante las variables de entorno (Fase 7, Configuration/Secrets).
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/laucom}
spring.datasource.username=${DB_USERNAME:laucom}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Fase 5 (Active Directory) — ADR-002: adapter opcional. Un proyecto sin AD deja ad.enabled=false
# (valor por defecto) y ActiveDirectoryAdapter simplemente no se registra como bean. Ningún
# secreto real en este archivo (REQ-AUTH-026): la contraseña de la cuenta de servicio se
# externaliza por completo, sin valor por defecto de desarrollo (a diferencia de DB_PASSWORD,
# que sí tiene un vacío explícito documentado como "solo desarrollo local").
ad.enabled=${AD_ENABLED:false}
ad.url=${AD_URL:}
ad.base-dn=${AD_BASE_DN:}
ad.domain=${AD_DOMAIN:}
ad.service-account.principal=${AD_SERVICE_ACCOUNT_PRINCIPAL:}
ad.service-account.password=${AD_SERVICE_ACCOUNT_PASSWORD:}

# Fase 8 (JWT) — ADR-007 (Access Token de corta duración, objetivo 15 min) y ADR-009 (firma
# asimétrica RSA + kid desde V1). Las claves NO tienen valor por defecto (a diferencia de
# ad.*/DB_PASSWORD): son un secreto criptográfico real, no una credencial de desarrollo vacía —
# si faltan, la aplicación debe fallar al arrancar, no arrancar con una clave insegura implícita.
# Formato: DER (PKCS8 para la privada, X.509 para la pública) codificado en Base64, para evitar
# el manejo de saltos de línea/encabezados PEM dentro de variables de entorno.
jwt.issuer=${JWT_ISSUER:laucom-auth}
jwt.audience=${JWT_AUDIENCE:laucom-clients}
jwt.access-token-ttl-seconds=${JWT_ACCESS_TOKEN_TTL_SECONDS:900}
jwt.kid=${JWT_KID:local-dev-key}
jwt.private-key-base64=${JWT_PRIVATE_KEY_BASE64:}
jwt.public-key-base64=${JWT_PUBLIC_KEY_BASE64:}

# Fase 9 (Refresh Tokens) — ADR-007/ADR-008: hipótesis inicial de 7 días, parámetro de bajo
# impacto y reversible (`.claude/core/decision-authority.md`, mismo criterio que la política de
# contraseña de SPEC-AUTH-007 y los umbrales de rate limiting de Fase 4), no requiere ADR propio.
refresh-token.ttl-days=${REFRESH_TOKEN_TTL_DAYS:7}

# Fase 12 (Master Admin) — SPEC-AUTH-009 RN-01/RN-02, ADR-019. master-admin.bootstrap-password-hash
# es un hash Argon2id YA GENERADO (nunca una contraseña en texto plano) que el operador de
# despliegue calcula fuera de la aplicación e inyecta por variable de entorno. Sin valor por
# defecto: es un secreto real (equivalente a las claves JWT), y su ausencia sin ya existir un
# administrador local provoca fail-fast en el arranque (RN-07), por diseño.
master-admin.username=${MASTER_ADMIN_USERNAME:admin}
master-admin.display-name=${MASTER_ADMIN_DISPLAY_NAME:Master Admin}
master-admin.email=${MASTER_ADMIN_EMAIL:}
master-admin.bootstrap-password-hash=${MASTER_ADMIN_BOOTSTRAP_PASSWORD_HASH:}
